<style>
/* Layout: one full-screen tilted plane of keycaps that pans forever; a fixed intro top-left; a screen-space card beside the lifted key. Single light theme on purpose: it matches kevintraver.com. */
:root {
  --surface: #040507;
  --ink: #f5f6f8;
  --body: #b6bac4;
  --muted: #8b909c;
  --accent: #8fb0ff;
  --glow: rgba(150, 180, 255, .16);
  --cap-edge: #07080b;
  --font: "Geist", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }

#stage { position: fixed; inset: 0; perspective: 1500px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(70% 55% at 50% -5%, rgba(70, 95, 170, .22) 0%, rgba(20, 28, 55, .12) 45%, transparent 75%), radial-gradient(90% 70% at 50% 115%, #0b0e16 0%, var(--surface) 70%); }
#dust { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
#dust .layer { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% + 640px); background-size: 640px 640px; will-change: transform; animation: drift 90s linear infinite; }
#dust .layer + .layer { animation: drift 60s linear infinite, twinkle 7s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, -640px, 0); } }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
#stage.dragging { cursor: grabbing; }
#plane { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }

.tile { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); transform-style: preserve-3d; border: 0; padding: 0; background: none; cursor: pointer; }
.tile .shadow { position: absolute; inset: -14%; border-radius: 50%; background: radial-gradient(closest-side at 50% 54%, rgba(0,0,0,.82) 32%, rgba(0,0,0,0) 78%), radial-gradient(closest-side, var(--glow) 0%, rgba(150,180,255,0) 100%); transform: translate3d(0, 10px, 0); transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s; }
.tile .cap { position: absolute; inset: 0; border-radius: 24%; background: linear-gradient(160deg, rgba(40, 46, 60, .9) 0%, rgba(16, 19, 26, .92) 100%);
  box-shadow: 0 6px 0 var(--cap-edge), 0 0 0 1px rgba(170, 195, 255, .14), inset 0 1px 0 rgba(255,255,255,.08); transform: translate3d(0, 0, 8px); transition: transform .5s cubic-bezier(.2,.8,.2,1);
  display: grid; place-items: center; }
.tile .face { width: 76%; height: 76%; border-radius: 22%; display: grid; place-items: center; overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.15); }
.tile .face svg { width: 52%; height: 52%; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
.tile .face img { width: 100%; height: 100%; object-fit: contain; display: block; }
.tile .face.app { background: none; box-shadow: none; width: 80%; height: 80%; }
#stage:not(.dragging) .tile:not(.sel):hover .cap { transform: translate3d(0, 0, 16px); }
.tile .pool { position: absolute; inset: -45%; border-radius: 50%; background: radial-gradient(closest-side, var(--hue) 0%, transparent 100%); opacity: 0; transform: translate3d(0, 6px, 0) scale(.7); transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
.tile.sel .cap { transform: translate3d(0, 0, 68px) scale(1.04); transition: transform .38s cubic-bezier(.34, 1.56, .64, 1); }
.tile.sel .shadow { transform: translate3d(0, 24px, 0) scale(1.3); opacity: .55; }
.tile.sel .pool { opacity: .55; transform: translate3d(0, 6px, 0) scale(1); }
#dim { position: absolute; left: 0; top: 0; width: 12000px; height: 12000px; background: #000; opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; pointer-events: none; }
#plane.has-sel #dim { opacity: .22; visibility: visible; transition: opacity .3s; }
.tile:focus-visible { outline: none; }
.tile:focus-visible .cap { box-shadow: 0 6px 0 var(--cap-edge), 0 0 0 4px var(--accent); }
.tile.sel .cap { box-shadow: 0 6px 0 var(--cap-edge), 0 0 0 1px rgba(190, 210, 255, .28), 0 0 44px rgba(150, 180, 255, .35); }

.intro { position: fixed; top: clamp(20px, 5vw, 56px); left: clamp(20px, 5vw, 64px); z-index: 6; pointer-events: none; transition: opacity .6s, transform .6s; max-width: calc(100vw - 40px); }
.intro p { margin: 0; font-size: clamp(16px, 1.5vw, 19px); color: var(--muted); }
.intro h1 { margin: 0; font-size: clamp(34px, 5vw, 64px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 500; text-wrap: balance; }
.intro.gone { opacity: 0; transform: translateY(-8px); }
.intro-bg { position: fixed; top: 0; left: 0; width: 0; height: 0; z-index: 4; pointer-events: none; transition: opacity .6s;
  background: rgba(4,5,7,.28); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent 100%); mask-image: radial-gradient(closest-side, #000 55%, transparent 100%); }
.intro-bg.gone { opacity: 0; visibility: hidden; transition: opacity .6s, visibility 0s .6s; }

.switch { position: fixed; top: clamp(16px, 4vw, 40px); right: clamp(16px, 4vw, 40px); z-index: 6; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(22,25,33,.8); backdrop-filter: blur(12px); box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 6px 20px rgba(0,0,0,.4); }
.switch button { border: 0; background: none; font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 999px; color: var(--muted); cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--ink); color: #0a0b0e; }

.card { position: fixed; z-index: 7; width: min(290px, calc(100vw - 32px)); background: #111319; border: 1px solid rgba(255,255,255,.09); border-radius: 18px;
  box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 40px rgba(120,150,255,.08); padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 8px;
  opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .3s, transform .3s; pointer-events: none; }
.card.on { opacity: 1; transform: none; pointer-events: auto; }
.card h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.1; overflow-wrap: anywhere; }
.card p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--body); }
.card a { font-size: 15px; color: var(--accent); text-decoration: none; font-weight: 500; align-self: flex-start; }
.card a:hover { text-decoration: underline; }


.hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 6; font-size: 13px; color: var(--muted); background: rgba(22,25,33,.88); padding: 6px 14px; border-radius: 999px; transition: opacity .3s; white-space: nowrap; }
.hint kbd { font-family: inherit; font-size: 12px; border: 1px solid #3a3e48; border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: #1b1e26; color: var(--ink); }

.proto { position: fixed; bottom: 18px; left: 18px; z-index: 6; font-size: 12px; color: var(--muted); }

@media (max-width: 640px) {
  .card { left: 16px !important; right: 16px; top: auto !important; bottom: 16px; width: auto; }
  .hint, .proto { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #dust .layer { animation: none; }
  .tile .cap, .tile .shadow, .card, .intro { transition: none; }
}
</style>

function selEl() { return sel && tiles.get(sel.c + "," + sel.r); }
function select(c, r) {
  const prev = selEl(); prev && prev.classList.remove("sel");
  sel = { c, r };
  syncTiles(true);
  const el = selEl(); el && el.classList.add("sel");
  const it = itemAt(c, r), p = posOf(c, r);
  document.getElementById("cName").textContent = it.name;
  document.getElementById("cDesc").textContent = it.desc;
  const a = document.getElementById("cLink"); a.href = it.link; a.textContent = it.linkText;
  const narrow = innerWidth <= 640;
  // Nudge the camera so the key sits left of center and the card has room on the right.
  target = { x: p.x + (narrow ? 0 : Math.min(220, innerWidth * 0.16)), y: p.y + (narrow ? RY * 0.9 : -RY * 0.25) };
  vel = { x: 0, y: 0 }; wake(600);
  plane.classList.add("has-sel"); card.classList.add("on"); hideIntro();
  if (el && !el.querySelector(".pool")) { const pool = document.createElement("span"); pool.className = "pool"; el.prepend(pool); }
  if (el) { el.dataset.anim = 1; setTimeout(() => { delete el.dataset.anim; }, 500); }
}
function deselect() { const el = selEl(); el && el.classList.remove("sel"); sel = null; plane.classList.remove("has-sel"); card.classList.remove("on"); }
let lastCardKey = "";
function placeCard() {
  if (!sel || innerWidth <= 640) return;
  const el = selEl(); if (!el) return;
  const key = cam.x.toFixed(1) + "," + cam.y.toFixed(1) + "," + innerWidth + "," + innerHeight + "," + sel.c + "," + sel.r;
  if (key === lastCardKey && !el.dataset.anim) return;
  lastCardKey = key;
  const r = el.querySelector(".cap").getBoundingClientRect();
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let x = r.right + 20; if (x + cw > innerWidth - 16) x = r.left - cw - 20;
  const y = Math.max(16, Math.min(innerHeight - ch - 16, r.top + r.height / 2 - ch / 2));
  card.style.left = x + "px"; card.style.top = y + "px";
}

/* Intro */
let introGone = false;
function hideIntro() { if (introGone) return; introGone = true; document.getElementById("intro").classList.add("gone"); document.getElementById("introBg").classList.add("gone"); }
function showIntro() { introGone = false; document.getElementById("intro").classList.remove("gone"); document.getElementById("introBg").classList.remove("gone"); }

/* Input */
let dragging = false, down = null, last = null, moved = 0;
stage.addEventListener("pointerdown", e => { wake(); down = { x: e.clientX, y: e.clientY }; last = { ...down, t: performance.now() }; moved = 0; vel = { x: 0, y: 0 }; target = null; stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => {
  if (!down) return;
  wake();
  const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6) {
    if (!dragging) { dragging = true; stage.classList.add("dragging"); hideIntro(); }
    const sy = dy / Math.cos(ANGLE);
    cam.x -= dx; cam.y -= sy;
    const dt = Math.max(1, performance.now() - last.t);
    vel = { x: -dx * 16 / dt, y: -sy * 16 / dt };
  }
  last = { x: e.clientX, y: e.clientY, t: performance.now() };
});
stage.addEventListener("pointerup", e => {
  stage.releasePointerCapture(e.pointerId);
  if (!dragging) {
    const t = document.elementFromPoint(e.clientX, e.clientY)?.closest(".tile");
    if (t) { const c = +t.dataset.c, r = +t.dataset.r; (sel && sel.c === c && sel.r === r) ? deselect() : select(c, r); }
    else deselect();
    vel = { x: 0, y: 0 };
  }
  else deselect();
  dragging = false; down = null; stage.classList.remove("dragging");
  wake(100);
});
stage.addEventListener("pointercancel", () => { dragging = false; down = null; stage.classList.remove("dragging"); });
let wheelEnd;
stage.addEventListener("wheel", e => { e.preventDefault(); target = null; hideIntro(); wake();
  const k = e.deltaMode === 1 ? 16 : 1;
  vel.x += e.deltaX * k * 0.06; vel.y += e.deltaY * k * 0.06 / Math.cos(ANGLE);
  clearTimeout(wheelEnd); wheelEnd = setTimeout(deselect, 180); }, { passive: false });
addEventListener("keydown", e => {
  const k = e.key;
  if (k === "Escape") { deselect(); return; }
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (!d) return;
  e.preventDefault(); hideIntro(); wake();
  if (sel) {
    const c = sel.c + d[0], r = sel.r + d[1];
    select(c, r);
  } else { target = { x: cam.x + d[0] * P, y: cam.y + d[1] * RY }; }
});

/* Mode switch */
document.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode; items = CURATED; pickMult();
  document.querySelectorAll(".switch button").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.getElementById("title").textContent = { skills: "Skills I’ve written.", curated: "Skills I’ve collected.", tools: "The tools I use every day." }[mode];
  deselect(); cam = { x: 0, y: 0 }; vel = { x: 0, y: 0 }; target = null; rebuild(); showIntro();
}));

function fitIntroBg() {
  const r = document.getElementById("intro").getBoundingClientRect(), bg = document.getElementById("introBg");
  const px = 90, py = 70;
  bg.style.left = (r.left - px) + "px"; bg.style.top = (r.top - py) + "px";
  bg.style.width = (r.width + px * 2) + "px"; bg.style.height = (r.height + py * 2) + "px";
}
addEventListener("resize", () => { sizes(); rebuild(); lastCam = ""; fitIntroBg(); wake(100); });
document.fonts.ready.then(fitIntroBg); fitIntroBg();
pickMult(); sizes(); syncTiles(true); wake(100);

/* Drifting dust: drawn once into a repeating tile, then moved by CSS animation
   (runs on the compositor, so the page does no per-frame work for it). */
(() => {
  const T = 640;
  function tile(n, rMax, alpha) {
    const c = document.createElement("canvas"); c.width = c.height = T; const x = c.getContext("2d");
    for (let i = 0; i < n; i++) {
      const r = Math.random() * rMax + .35, px = Math.random() * T, py = Math.random() * T;
      x.fillStyle = `rgba(190, 210, 255, ${alpha * (.5 + Math.random() * .5)})`;
      x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill();
    }
    return c.toDataURL();
  }
  document.querySelectorAll("#dust .layer").forEach((el, i) => { el.style.backgroundImage = `url(${tile(i ? 14 : 22, i ? 1.4 : 1, i ? .6 : .45)})`; });
})();
</script>
</body>
